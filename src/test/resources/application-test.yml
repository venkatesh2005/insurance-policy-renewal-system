spring:
  datasource:
    url: jdbc:h2:mem:policyrenewaltestdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  sql:
    init:
      mode: always

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

renewal:
  detection:
    window-days: 30
    chunk-size: 10
  lapse:
    grace-period-days: 15
    chunk-size: 10

notification:
  poll:
    interval-ms: 5000
    batch-size: 5
    worker-count: 3
  pool:
    core-size: 3
    max-size: 5
    queue-capacity: 50
  retry:
    max-attempts: 3
    base-delay-minutes: 1

report:
  output-dir: build/test-reports
